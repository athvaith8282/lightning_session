name: session_08_pipeline
on: 
  push:
    branches: [ session_08 ]
jobs:
  run_pipeline:
    name: Do the job on the runner
    runs-on: self-hosted # run the job on the newly created runner
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
      
      - name: Setup DVC
        uses: iterative/setup-dvc@v1
      
      - name: Setup CML
        uses: iterative/setup-cml@v2
      
      - name: Pull DVC data
        run: dvc pull -r session08_s3 data/CatRabbit
      
      - name: Run tests with coverage
        run: |
            uv run coverage run -m pytest
            uv run coverage xml -o coverage.xml
    
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
      
      - name: Train model
        run: |
          uv run dvc repro
        
      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Training Metrics" >> report.md
          
          # Find the latest metrics.csv file
          METRICS_FILE=$(find logs/cat_dog_exp/runs -name "metrics.csv" | sort -r | head -n 1)
          
          # Generate plots using the Python script
          uv run python scripts/generate_plots.py "$METRICS_FILE"
          
          #push results to s3
          uv run python scripts/push_model_to_s3.py logs/
  
          # Add plots to the report
          echo "### Accuracy" >> report.md
          echo '![](./training_and_validation_accuracy_plot.png "Accuracy plot")' >> report.md
          
          echo "### Loss" >> report.md
          echo '![](./training_and_validation_loss_plot.png "Loss plot")' >> report.md
          
          echo '### Confusion_matrix'
          echo '![](./confusion_matrix.png "Confusion matrix")' >> report.md
  
  
          echo "## Prediction Images" >> report.md
          for image in prediction/*.png; do
            echo "![]($image)" >> report.md
          done
  
          
          # Add test metrics if available
          if grep -q "test/acc" $METRICS_FILE; then
            echo "## Test Metrics" >> report.md
            TEST_ACC=$(tail -n 1 $METRICS_FILE | cut -d',' -f3)
            TEST_LOSS=$(tail -n 1 $METRICS_FILE | cut -d',' -f4)
            echo "- Test Accuracy: $TEST_ACC" >> report.md
            echo "- Test Loss: $TEST_LOSS" >> report.md
          fi
          
          # Create and post the report
          cml comment create report.md
      - name: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: athvaith/session_08
          IMAGE_TAG: ${{ github.repository }}
          run: |
            docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
            docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG