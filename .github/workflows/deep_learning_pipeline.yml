name: session_08_pipeline
on: 
  push:
    branches: [ session_08 ]
jobs:
  run_pipeline:
    name: Do the job on the runner
    runs-on: self-hosted # run the job on the newly created runner
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
      
      - name: Setup DVC
        uses: iterative/setup-dvc@v1
      
      - name: Pull DVC data
        run: dvc pull -r session08_s3 data/CatRabbit
      
      - name: Run tests with coverage
        run: |
            uv run coverage run -m pytest
            uv run coverage xml -o coverage.xml
    
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
      
      - name: Train model
        run: |
          uv run dvc repro
      - name: Push to s3
        run: |
          uv run python scripts/push_model_to_s3.py logs/
      - name: login-ecr
        run: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 495599772594.dkr.ecr.ap-south-1.amazonaws.com
            docker build -t 495599772594.dkr.ecr.ap-south-1.amazonaws.com/athvaith/session_08:latest .
            docker push 495599772594.dkr.ecr.ap-south-1.amazonaws.com/athvaith/session_08:latest