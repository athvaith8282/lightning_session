# @package _global_

# to execute this experiment run:
# python train.py experiment=catdog_ex

defaults:
  - override /data: dogbreed
  - override /model: timm_classifier
  - override /callbacks: default
  - override /loggers: default
  - override /trainer: default

callbacks:
  model_checkpoint:
    monitor: "val/acc"
    mode: "max"
    save_top_k: 1
    save_last: True

  early_stopping:
    monitor: "val/acc"
    patience: 10
    mode: "max"

task_name: hydra_test

tags: ["run1"]

train: True

test: True