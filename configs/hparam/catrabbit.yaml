# @package _global_

defaults:
  - override /hydra/sweeper: optuna

optimization_metric: "test/acc_best"

experiment_name: ${task_name}_optimization

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
      n_startup_trials: 2
    direction: maximize
    study_name: ${task_name}_optimization
    storage: null
    n_trials: 4
    n_jobs: 10
    
    params:
      model.depths: choice([2, 2, 4, 2], [2, 4, 4, 2])
      model.dims: choice([16,32,64,64], [32,64,64,128])
      model.ls_init_value: interval(1e-7, 1e-6)
      model.patch_size: choice(4,8)